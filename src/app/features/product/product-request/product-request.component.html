<h2 mat-dialog-title>Create Product</h2>
<mat-dialog-content class="mat-typography">
  <form [formGroup]="productFormGroup" (ngSubmit)="saveProduct()">
    <div class="mb-6">
      <label for="first_name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Product name</label>
      <input type="text" id="first_name"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
        placeholder="shoes" required formControlName="productName"/>
    </div>
    <div class="grid gap-6 mb-6 md:grid-cols-2">
      <div>
        <label for="first_name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Product
          price</label>
        <input type="text" id="first_name"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="200" required formControlName="price"/>
      </div>
      <div>
        <label for="first_name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">HSN Code</label>
        <input type="text" id="first_name"
          class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500"
          placeholder="64039110" required formControlName="productHSNCode"/>
      </div>
    </div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">

    class="text-white bg-yellow-400 hover:bg-yellow-500 focus:outline-none focus:ring-4 focus:ring-yellow-300 font-medium rounded-full text-sm px-5 py-2.5 text-center me-2 mb-2 dark:focus:ring-yellow-900"
    (click)="closeDialog()">Cancel</button>
  <button
    class="select-none rounded-lg bg-green-500 py-3 px-6 text-center align-middle font-sans text-xs font-bold uppercase text-white shadow-md shadow-green-500/20 transition-all hover:shadow-lg hover:shadow-green-500/40 focus:opacity-[0.85] focus:shadow-none active:opacity-[0.85] active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none"
    type="button" (click)="navigateToRequest()">
    Save Product
  </button> -->

  <button mat-button style="background-color: rgb(237, 253, 3);" mat-dialog-close (click)="closeDialog()">Cancel</button>
  <button mat-button style="background-color: #22c55e;" mat-dialog-close (click)="saveProduct()">Save Product</button>
</mat-dialog-actions>
